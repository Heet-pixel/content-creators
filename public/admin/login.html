<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Admin Login | Content Crafters</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="/admin/admin.css">
</head>
<body>

<div class="auth-shell">
  <div class="auth-card">
    <div class="auth-logo"><img src="/assets/logo-compact.png" alt="Content Crafters"></div>

    <!-- ============ LOGIN VIEW ============ -->
    <div class="auth-view active" id="viewLogin">
      <h1 class="auth-title">Admin Login</h1>
      <p class="auth-sub">Sign in to view and manage enquiries.</p>

      <div class="auth-error" id="loginError"></div>

      <form id="loginForm">
        <div class="field">
          <label for="loginEmail">Email</label>
          <input type="text" id="loginEmail" autocomplete="username" required>
        </div>
        <div class="field">
          <label for="loginPassword">Password</label>
          <input type="password" id="loginPassword" autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="loginSubmit">Log In</button>
      </form>

      <div class="auth-links">
        <button type="button" class="link" id="goForgot">Forgot password?</button>
      </div>
    </div>

    <!-- ============ FORGOT: REQUEST OTP ============ -->
    <div class="auth-view" id="viewForgotRequest">
      <h1 class="auth-title">Reset Password</h1>
      <p class="auth-sub">Enter your admin email and we'll send a one-time code.</p>

      <div class="auth-error" id="forgotError"></div>
      <div class="auth-success" id="forgotSuccess"></div>

      <form id="forgotRequestForm">
        <div class="field">
          <label for="forgotEmail">Email</label>
          <input type="text" id="forgotEmail" autocomplete="username" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="forgotSubmit">Send OTP</button>
      </form>

      <div class="auth-links">
        <button type="button" class="link" id="backToLogin1">Back to login</button>
      </div>
    </div>

    <!-- ============ FORGOT: ENTER OTP + NEW PASSWORD ============ -->
    <div class="auth-view" id="viewForgotReset">
      <h1 class="auth-title">Enter Code</h1>
      <p class="auth-sub">Enter the 6-digit code we sent, plus your new password.</p>

      <div class="auth-error" id="resetError"></div>

      <form id="forgotResetForm">
        <div class="field field-otp">
          <label for="otpCode">OTP Code</label>
          <input type="text" id="otpCode" inputmode="numeric" maxlength="6" placeholder="••••••" required>
        </div>
        <div class="field">
          <label for="newPassword">New Password</label>
          <input type="password" id="newPassword" autocomplete="new-password" minlength="8" required>
        </div>
        <div class="field">
          <label for="confirmPassword">Confirm New Password</label>
          <input type="password" id="confirmPassword" autocomplete="new-password" minlength="8" required>
        </div>
        <p class="auth-hint">Minimum 8 characters.</p>
        <button type="submit" class="btn btn-primary btn-block" id="resetSubmit">Reset Password</button>
      </form>

      <div class="auth-links">
        <button type="button" class="link" id="backToLogin2">Back to login</button>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast">
  <svg viewBox="0 0 24 24" fill="none"><path d="M20 6 9 17l-5-5" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
  <span id="toastMsg"></span>
</div>

<script src="/admin/admin-auth.js"></script>
</body>
</html>
